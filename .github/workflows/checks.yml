# The same checks as running them locally: the snapshots, tests, type checking and linters.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # Nothing here pushes
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --group dev
      - run: python .github/scripts/fetch.py vanilla  # Vanilla's own files, for vanilla_mcdoc.vanilla (they aren't committed either)
      - run: coverage run main.py  # Generates vanilla_mcdoc/ (it isn't committed), and compares it against tests/assertions
      - run: coverage run --append -m pytest -q
      - run: python .github/scripts/validate.py  # Every vanilla data file (from mcmeta) against the generated models, see its KNOWN_INVALID
      - run: coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"  # The table on the run's page
      - run: coverage report  # Fails if it's under fail_under in pyproject.toml
      # mypy's cache from the last run (and this run's is saved for the next), as checking everything takes it about 40s
      # and only rechecks what's changed with it. A new key each run, as a cache can't be updated, only added.
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ github.sha }}
          restore-keys: mypy-
      - run: mypy . --strict
      - run: ruff check
      - run: flake8 --ignore=E501,W503,W391,E221
      - run: pylint .
      - run: codespell
      - run: codespell --check-hidden .github  # It skips folders starting with a dot otherwise
      - run: vulture
      - run: zizmor .github
