# The package this repo publishes: only the generated vanilla_mcdoc/ (main.py builds it), not the generator itself
[project]
name = "vanilla-mcdoc"
dynamic = ["version"]  # The Minecraft version it was generated for, e.g. 26.4-snapshot-3 -> 26.4.0a3
description = "Pydantic models for Minecraft's data packs and resource packs, generated from Spyglass's vanilla-mcdoc"
readme = "README.md"  # The PyPI page
requires-python = ">=3.14"  # Generated classes use annotations that are only imported under TYPE_CHECKING (needs PEP 649)
dependencies = ["pydantic>=2.11"]  # For validate_by_name and serialize_by_alias

[dependency-groups]
# What the generator and its checks need: `pip install --group dev` (pip 25.1+)
dev = [  # ruff and zizmor are pinned, as new versions turn on new rules
    "pydantic>=2.11", "pytest", "coverage", "mypy", "ruff==0.17.*", "flake8", "pylint", "codespell", "vulture", "zizmor==1.30.*", "pre-commit", "build", "pyyaml", "types-PyYAML",
]

# ========================================================================
# Build/packaging

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vanilla_mcdoc/__init__.py"  # main.py writes __version__ into it

[tool.hatch.build]
ignore-vcs = true  # vanilla_mcdoc/ is in .gitignore (it's generated), which hatch would otherwise leave out
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["vanilla_mcdoc"]

[tool.hatch.build.targets.sdist]
include = ["vanilla_mcdoc", "README.md"]

# ========================================================================
# Linting

[tool.mypy]
python_version = "3.14"
platform = "linux"  # What CI runs it on, so it's the same on Windows (it treats `if sys.platform == ...` as always one way)
strict = true
exclude = "^tests/"
explicit_package_bases = true  # Name modules from the repo root, so static_symbols/x.py is static_symbols.x (as the generator imports it)
mypy_path = ".github/scripts"  # Where the tests import the CI scripts from (mypy skips folders starting with a dot otherwise)

# --- strict = true already enables the following, but listed explicitly: ---
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# --- Extras that `strict` doesn't include ---
disallow_any_unimported = false  # This is just too much.
disallow_any_expr = false        # Too noisy, we also need `Any` sometimes.
disallow_any_explicit = false    # Also very noisy
implicit_reexport = false        # We allow this here, we don't allow it in vanilla_mcdoc/*
disallow_any_decorated = true
strict_optional = true
strict_bytes = true

[tool.pyright]
extraPaths = [".github/scripts"]  # So Pylance finds the CI scripts the tests import, like mypy_path above

[tool.ruff]
line-length = 220  # Same as pylint's (it's used when sorting imports)
src = [".", ".github/scripts"]  # So the CI scripts are sorted as ours when imported
extend-exclude = ["tests/assertions"]  # Snapshots of generated code (vanilla_mcdoc/ itself is left out by .gitignore)

[tool.ruff.lint.isort]
split-on-trailing-comma = false  # Keep imports on one line where they fit, like the rest of the code
known-first-party = ["vanilla_mcdoc"]  # It's ours (just generated, and gitignored), as pylint sees it too

[tool.ruff.lint]
ignore = ["F821"]  # F821 is some noise for undefined name.

[tool.pylint.main]
init-hook = "import sys; sys.path.append('.github/scripts')"  # So it can find the CI scripts when they import each other (and the tests import them)
# Generated output (and the snapshots of it), we lint the generator instead
ignore-paths = [
    "^vanilla_mcdoc[\\\\/]",
    "^htmlcov[\\\\/]",
    "^tests[\\\\/]assertions[\\\\/]",
    "symbols.json",
    "versions.json",
    "pyproject.toml",
    "temp.txt",
]

[tool.pylint.format]
max-line-length = 220
max-module-lines = 1200

[tool.pylint.design]
max-locals = 16
max-attributes = 10

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-module-docstring",
    "missing-function-docstring",
    "fixme",  # Come on, this is a linter, not a TODO tracker
    "invalid-name",  # We're generating code, most of it is not properly cased.
    "missing-timeout",  # 2 functions, not interested.
    "no-member",  # Noisy.
    "import-outside-toplevel",

    "abstract-method",  # Too many false positives
    "protected-access",  # Maybe look into.
]

[tool.codespell]
# The generated code and upstream data have upstream's spellings, which aren't ours to fix
skip = "vanilla_mcdoc,htmlcov,tests/assertions,symbols.json,versions.json,registries.json,upstream.json,temp.txt,.coverage,*.pyc,dist,build"

# ========================================================================
# Testing

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".github/scripts"]  # So the tests can import the CI scripts

# ========================================================================
# Coverage, Dead code

[tool.coverage.run]
# `coverage run main.py`, then `coverage run --append -m pytest`, then `coverage report` (as CI does)
branch = true
omit = ["vanilla_mcdoc/*", "tests/*", "htmlcov/*"]  # Just the generator (vanilla_mcdoc/ is what it generates)

[tool.coverage.report]
fail_under = 95  # It's 95%, mostly missing .github/scripts' downloading
skip_covered = true

[tool.vulture]
# Finds unused code. Run as `vulture`, with no arguments
paths = ["."]
exclude = ["vanilla_mcdoc/", "htmlcov/", "tests/assertions/", "tests/test_example.py"]  # test_example.py is an example of using the package, not a test
ignore_decorators = ["@model_validator", "@pytest.fixture"]  # Pydantic and pytest call these themselves
ignore_names = [
    # static_symbols/ is copied into vanilla_mcdoc/, where generated code (and users) use these
    "GeneratedModel", "model_config", "tag_of", "import_annotation_types", "NamespacedId", "MinecraftUUID", "MinecraftUUIDString", "MinecraftURL", "uuid_to_int_array",
    "keyword",  # A field symbols.json has, which pydantic reads in
    "definition", "prefix", "empty",  # IdSpec's fields, which its to_annotation goes through with dataclasses.fields()
]

# ========================================================================
