[tool.mypy]
python_version = "3.14"
strict = true
exclude = "generated_symbols.data.structure.StructureNBT"  # TODO: Fix this.

# --- strict = true already enables the following, but listed explicitly: ---
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# --- Extras that `strict` doesn't include ---
disallow_any_unimported = false  # This is just too much.
disallow_any_expr = false        # Too noisy, we also need `Any` sometimes.
disallow_any_explicit = false    # Also very noisy
implicit_reexport = false        # We allow this here, we don't allow it in generated_symbols/*
disallow_any_decorated = true
strict_optional = true
strict_bytes = true

[tool.ruff.lint]
ignore = ["F821"]

[tool.pylint.main]
# Generated output (and the snapshots of it), we lint the generator instead
ignore-paths = [
    "^generated_symbols[\\\\/]",
    "^htmlcov[\\\\/]",
    "^tests[\\\\/]assertions[\\\\/]",
    "symbols.json",
    "versions.json",
    "pyproject.toml",
    "temp.txt",
]

[tool.pylint.format]
max-line-length = 220
max-module-lines = 1200

[tool.pylint.design]
max-locals = 16
max-attributes = 10

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-module-docstring",
    "missing-function-docstring",
    "fixme",  # Come on, this is a linter, not a TODO tracker
    "invalid-name",  # We're generating code, most of it is not properly cased.
    "missing-timeout",  # 2 functions, not interested.
    "no-member",  # Noisy.
    "import-outside-toplevel",

    "abstract-method",  # Too many false positives
    "protected-access",  # Maybe look into.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
