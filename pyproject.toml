# The package this repo publishes: only the generated vanilla_mcdoc/ (main.py builds it), not the generator itself
[project]
name = "vanilla-mcdoc"
dynamic = ["version"]  # The Minecraft version it was generated for, e.g. 26.4-snapshot-3 -> 26.4.0a3
description = "Pydantic models for Minecraft's data packs and resource packs, generated from Spyglass's vanilla-mcdoc"
readme = "README.md"  # The PyPI page
requires-python = ">=3.14"  # Generated classes use annotations that are only imported under TYPE_CHECKING (needs PEP 649)
dependencies = ["pydantic>=2.11"]  # For validate_by_name and serialize_by_alias

[dependency-groups]
# What the generator and its checks need: `pip install --group dev` (pip 25.1+)
dev = ["pydantic>=2.11", "pytest", "coverage", "mypy", "ruff==0.17.*", "flake8", "pylint", "build"]  # ruff is pinned, as new versions turn on new rules

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vanilla_mcdoc/__init__.py"  # main.py writes __version__ into it

[tool.hatch.build]
ignore-vcs = true  # vanilla_mcdoc/ is in .gitignore (it's generated), which hatch would otherwise leave out
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["vanilla_mcdoc"]

[tool.hatch.build.targets.sdist]
include = ["vanilla_mcdoc", "README.md"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = "vanilla_mcdoc.data.structure.StructureNBT"  # TODO: Fix this.
explicit_package_bases = true  # Name modules from the repo root, so static_symbols/x.py is static_symbols.x (as the generator imports it)

# --- strict = true already enables the following, but listed explicitly: ---
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
extra_checks = true

# --- Extras that `strict` doesn't include ---
disallow_any_unimported = false  # This is just too much.
disallow_any_expr = false        # Too noisy, we also need `Any` sometimes.
disallow_any_explicit = false    # Also very noisy
implicit_reexport = false        # We allow this here, we don't allow it in vanilla_mcdoc/*
disallow_any_decorated = true
strict_optional = true
strict_bytes = true

[tool.ruff]
line-length = 220  # Same as pylint's (it's used when sorting imports)
extend-exclude = ["tests/assertions"]  # Snapshots of generated code (vanilla_mcdoc/ itself is left out by .gitignore)

[tool.ruff.lint.isort]
split-on-trailing-comma = false  # Keep imports on one line where they fit, like the rest of the code
known-first-party = ["vanilla_mcdoc"]  # It's ours (just generated, and gitignored), as pylint sees it too

[tool.ruff.lint]
ignore = ["F821"]  # F821 is some noise for undefined name.

[tool.pylint.main]
# Generated output (and the snapshots of it), we lint the generator instead
ignore-paths = [
    "^vanilla_mcdoc[\\\\/]",
    "^htmlcov[\\\\/]",
    "^tests[\\\\/]assertions[\\\\/]",
    "symbols.json",
    "versions.json",
    "pyproject.toml",
    "temp.txt",
]

[tool.pylint.format]
max-line-length = 220
max-module-lines = 1200

[tool.pylint.design]
max-locals = 16
max-attributes = 10

[tool.pylint."messages control"]
disable = [
    "missing-class-docstring",
    "missing-module-docstring",
    "missing-function-docstring",
    "fixme",  # Come on, this is a linter, not a TODO tracker
    "invalid-name",  # We're generating code, most of it is not properly cased.
    "missing-timeout",  # 2 functions, not interested.
    "no-member",  # Noisy.
    "import-outside-toplevel",

    "abstract-method",  # Too many false positives
    "protected-access",  # Maybe look into.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
