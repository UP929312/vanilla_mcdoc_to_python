# The quicker checks from .github/workflows/checks.yml, before each commit. Set up once with `pre-commit install`
# (after `pip install --group dev`), or run them all with `pre-commit run --all-files`. mypy, pylint and the tests are
# slower, so they're left to CI. They're all `language: system`, so they use the versions the dev group installs.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude  # --force-exclude, so pyproject.toml's excludes apply to the files it's given too
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8 --ignore=E501,W503,W391,E221
        language: system
        types: [python]
        exclude: ^tests/assertions/
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
        exclude: ^(tests/assertions/|symbols\.json|versions\.json|temp\.txt)
      - id: vulture
        name: vulture
        entry: vulture  # Checks the whole project, as code is only unused if nothing anywhere uses it
        language: system
        types: [python]
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: zizmor .github
        language: system
        files: ^\.github/
        pass_filenames: false
