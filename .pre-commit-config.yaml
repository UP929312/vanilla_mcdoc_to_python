# The quicker checks from .github/workflows/checks.yml, before each commit, and all of CI's jobs before each push (see
# .github/scripts/local_ci.py). Set up once with `pre-commit install` (after `pip install --group dev`),
# or run them all with `pre-commit run --all-files`. They're all `language: system`, so
# they use the versions the dev group installs.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]  # Only local-ci runs before a push, it does the rest anyway
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude  # --force-exclude, so pyproject.toml's excludes apply to the files it's given too
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8 --ignore=E501,W503,W391,E221
        language: system
        types: [python]
        exclude: ^tests/assertions/
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
        exclude: ^(tests/assertions/|symbols\.json|versions\.json|registries\.json|temp\.txt)
      - id: vulture
        name: vulture
        entry: vulture  # Checks the whole project, as code is only unused if nothing anywhere uses it
        language: system
        types: [python]
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: zizmor .github
        language: system
        files: ^\.github/
        pass_filenames: false
      - id: local-ci
        name: CI's jobs
        entry: python .github/scripts/local_ci.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
